name: Build

# main 브랜치 push / PR 마다 단위 테스트를 돌리고 디버그 APK를 만듭니다.
# (디버그 APK는 테스트용입니다. 배포용 서명 APK는 release.yml 이 태그 push 때 만듭니다.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain testDebugUnitTest 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          MSG=$(grep -E "^e: |What went wrong|Execution failed|FAILED|AssertionError|Exception" -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::error title=build-errors::$MSG"
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Epubmaker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
