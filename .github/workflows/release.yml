name: Release

# v1.0.1 같은 태그를 push 하면 서명된 APK를 빌드하고, 업데이트 서명(.sig)과 함께 릴리스로 올립니다.
# 서명 키는 저장소가 아니라 GitHub Secrets 에만 있습니다. 포크에서는 실행되지 않습니다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository_owner == 'hdlee73'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check secrets
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD UPDATE_SIGNING_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::GitHub Secret $v 이(가) 설정되지 않았습니다. README의 '최초 1회 설정'을 먼저 진행하세요."
              exit 1
            fi
          done

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "Epubmaker-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign APK for in-app update verification
        run: |
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update_key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update_key.pem" \
            -out "Epubmaker-$VERSION.apk.sig" "Epubmaker-$VERSION.apk"
          rm -f "$RUNNER_TEMP/update_key.pem" "$RUNNER_TEMP/release.jks"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v v="## v$VERSION" '$0==v{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Epubmaker v$VERSION" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "Epubmaker-$VERSION.apk" "Epubmaker-$VERSION.apk.sig" \
            --title "Epubmaker v$VERSION" --notes-file notes.md
